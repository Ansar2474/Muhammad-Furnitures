name: Rebuild website
# Runs when a product file or photo changes (from the /admin/ page), or when you press "Update website now".
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'images/products/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages from product files
        run: python3 tools/build_site.py
      - name: Save the rebuilt pages
        run: |
          git config user.name "Furniture site builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; else git commit -m "Rebuild pages from product files" && git pull --rebase -q origin main && git push; fi
